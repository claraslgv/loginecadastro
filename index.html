!<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Programa Arca</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
    
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="https://via.placeholder.com/200x60?text=Programa+Arca" alt="Programa Arca Logo">
        </div>
        <div class="header-right">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="search">
            </div>
            <i class="fa-solid fa-bars menu-icon"></i>
        </div>
    </header>

    <main class="main-container">
        
        <section class="login-section">
            <h1 class="login-title">Login</h1>
            
            <div class="login-box">
                <form action="#">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password">
                    </div>
                    
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembre-se de mim</label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-login">Login</button>
                        <div class="links">
                            <a href="#">Esqueceu sua senha?</a>
                            <a href="#">Não tem uma conta?</a>
                        </div>
                    </div>
                </form>

                <div class="divider">
                    <span class="line"></span>
                    <span class="text">OR</span>
                    <span class="line"></span>
                </div>
                
                <p class="social-text">Sign In using your account with</p>
                
                <div class="social-buttons">
                    <button class="btn-social">
                        <i class="fa-brands fa-facebook" style="color: #3b5998;"></i> Facebook
                    </button>
                    <button class="btn-social">
                        <i class="fa-brands fa-google" style="color: #db4437;"></i> Google
                    </button>
                </div>
            </div>
        </section>

        <section class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-placeholder">
                    <span>Área do Carrossel de Fotos</span>
                </div>

            </div>
        </section>

    </main>

    <header class="header">
        <div class="logo">
            <img src="https://via.placeholder.com/200x60?text=Programa+Arca" alt="Programa Arca Logo">
        </div>
        <div class="header-right">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="search">
            </div>
            <i class="fa-solid fa-bars menu-icon"></i>
        </div>
    </header>

    <main class="main-container">
        
        <section class="login-section">
            <h1 class="login-title">Register</h1>
            
            <div class="login-box register-box">
                <form action="#">
                    <div class="form-group">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome">
                    </div>
                    
                    <div class="form-group">
                        <label for="cpf">Cpf:</label>
                        <input type="text" id="cpf" name="cpf">
                    </div>

                    <div class="form-group">
                        <label for="nascimento">Data de nascimento:</label>
                        <div class="date-wrapper">
                            <input type="text" id="nascimento" name="nascimento" placeholder="  /  /  " class="date-input">
                            <i class="fa-regular fa-calendar-days"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha">
                    </div>

                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar senha:</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha">
                    </div>

                    <div class="form-actions center-action">
                        <button type="submit" class="btn-confirm">Confirmar</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-placeholder">
                    <span>Área do Carrossel de Fotos</span>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
